server:
  port: 8080

spring:
  profiles:
    # 本地开发默认 local；容器里由 compose 注入 SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:local}
  mvc:
    async:
      # SSE 是长连接，超过默认的异步超时会被容器掐断
      request-timeout: 300000      # 单位毫秒，5 分钟
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/insurance_biz?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 让 @EnumValue 生效：UserStatus 这类枚举与数据库里的字符串互转
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: auto

jwt:
  # 必须由环境变量或 .env 提供，缺失则启动失败
  secret: ${JWT_SECRET}
  expire-minutes: ${JWT_EXPIRE_MINUTES:1440}

internal:
  # Python 侧回调内部接口时校验的令牌，缺失则启动失败
  token: ${INTERNAL_TOKEN}

# 接口文档：浏览器打开 http://localhost:8080/doc.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn

agent:
  # Python 服务地址
  base-url: ${AGENT_BASE_URL:http://127.0.0.1:8001}
  # 等响应头的上限。SSE 会立刻返回 200 头，真正长的是后面的流
  response-timeout: ${AGENT_RESPONSE_TIMEOUT:120s}
  # 连不上要尽快失败，别让前端干等
  connect-timeout: ${AGENT_CONNECT_TIMEOUT:5s}
logging:
  pattern:
    # 关键是把 %X{traceId} 加进去，没有 traceId 时显示为空
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}] %-40.40logger{39} : %msg%n"