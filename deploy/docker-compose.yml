services:
  postgres:
    image: postgres:16
    container_name: hm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurance}
      POSTGRES_USER: ${POSTGRES_USER:-insurance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insurance123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insurance} -d ${POSTGRES_DB:-insurance}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - insurance-net

  # 业务库：Java 侧专用（PostgreSQL 留给 Agent 侧，见 MIGRATION.md）
  mysql:
    image: mysql:8.0
    container_name: hm-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-insurance123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-insurance_biz}
      MYSQL_USER: ${MYSQL_USER:-insurance}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-insurance123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动时自动执行建表脚本（仅当数据卷为空时生效）
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - insurance-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    container_name: hm-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - insurance-net

  minio:
    # 原版 minio/minio 在国内拉不动，换成 pgsty 的等价镜像
    image: pgsty/minio:latest
    container_name: hm-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin2026}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - insurance-net

  milvus:
    image: milvusdb/milvus:v3.0.0
    container_name: hm-milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin2026}
    command: milvus run standalone
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
      - ./milvus/user.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - insurance-net
  attu:
    image: zilliz/attu:v3.0.0
    ports:
      - "3000:3000"
    environment:
      - MILVUS_ADDRESS=milvus:19530
    volumes:
      - attu-data:/data
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - insurance-net

  # ---------- 应用 ----------

  # Java 业务服务：唯一对外入口
  backend:
    build:
      context: ../insurance-biz
    image: hm-insurance/backend:latest
    container_name: hm-backend
    env_file:
      - ../insurance-biz/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 容器网络里用服务名，覆盖 .env 里的 IP
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      AGENT_BASE_URL: http://agent:8001
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      agent:
        condition: service_started
    restart: unless-stopped
    networks:
      - insurance-net

  # Python Agent 服务：主要对内网暴露，端口留着方便排查
  agent:
    build:
      context: ../agent-service
    image: hm-insurance/agent:latest
    container_name: hm-agent
    env_file:
      - ../agent-service/.env
    environment:
      APP_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      JAVA_BASE_URL: http://backend:8080
    ports:
      - "${AGENT_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - insurance-net

  # 前端静态站点 + Nginx 反向代理（/api 转发给 backend:8080）
  frontend:
    build:
      context: ../frontend
    image: hm-insurance/frontend:latest
    container_name: hm-frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - insurance-net

volumes:
  postgres_data:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  attu-data:

networks:
  insurance-net:
    driver: bridge
